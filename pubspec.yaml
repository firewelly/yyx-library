name: novelmgt_flutter
description: YYX书库（YYX Library）— 跨平台个人书库管理与阅读器（macOS/Windows/Linux/Web/fnOS）：书架管理、多格式导入、在线阅读、爬虫抓取、NAS 服务端书库
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # 路由
  go_router: ^14.2.0

  # 数据库
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common: ^2.5.0
  path: ^1.9.0

  # 偏好存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 网络请求
  dio: ^5.4.3+1

  # JSON 序列化
  json_annotation: ^4.12.0
  freezed_annotation: ^2.4.0

  # 文件选择
  file_picker: ^8.0.3

  # EPUB 解析
  epubx: ^4.0.0

  # 编码检测
  # PDF 导出(生成 PDF 文档,与 epubx 共用 image 3.x)
  pdf: ^3.8.4

  # PDF 文本抽取(导入文字版 PDF)
  # 本地 vendor（上游 1.3.5 + 空安全补丁）：Dart 3.11 收紧闭包捕获变量类型提升，
  # 上游 pdf_file_cache.dart 编译报错（AOT 与测试编译均失败），等官方发版后可移除。
  # 补丁见 third_party/pdfrx/lib/src/pdfium/pdf_file_cache.dart（搜索「本地补丁」）。
  pdfrx:
    path: third_party/pdfrx

  # Kindle/MOBI/AZW3 解析(纯 Dart,不做 DRM 移除)
  kindle_unpack: ^0.1.1

  # HTML 解析(抽取 EPUB/MOBI 中的章节 HTML)
  html: ^0.15.4

  # 章节内容 gzip 压缩存储(纯 Dart,桌面/Web 通用)
  archive: ^3.6.1

  # HTTP 客户端（服务端 API 远程书库模式）
  http: ^1.2.0

  # 平台工具
  path_provider: ^2.1.3
  platform: ^3.1.4

  # UI 增强
  flutter_staggered_grid_view: ^0.7.0

  # 图标
  cupertino_icons: ^1.0.8
  sqflite_common_ffi_web: ^0.4.5+1
  charset: ^2.0.1
  dart3_big5: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^4.0.0

  # 代码生成工具链(用于 json_serializable / freezed 生成 .g.dart)
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # OpenCC 繁简转换词典（阅读器繁简切换 + 搜索繁简匹配）
  assets:
    - assets/zh_dict/
