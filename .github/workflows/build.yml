name: Build Desktop Packages

on:
  workflow_dispatch:      # 手动触发
  push:
    tags: ['v*']          # 打 tag 自动构建

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: ''            # Windows 无打包脚本，直接 zip
          - os: macos-latest
            name: macos
            script: tool/package_macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Disable Swift Package Manager (macOS CI fix)
        if: matrix.name == 'macos'
        run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "yyx-library-${{ github.ref_name }}-windows-x64.zip"

      - name: Build (macOS)
        if: matrix.name == 'macos'
        run: |
          chmod +x tool/package_macos.sh
          ./tool/package_macos.sh

      - name: Rename macOS zip
        if: matrix.name == 'macos'
        run: |
          f=$(ls dist/*.zip | head -1)
          mv "$f" "yyx-library-${{ github.ref_name }}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.zip
            dist/*.zip
          if-no-files-found: error
