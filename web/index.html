<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YYX书库 — 个人书库管理与阅读">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="YYX书库">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>YYX书库</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 强制 CanvasKit 与字体回退全部从本地加载（隐私审计：消除对 gstatic.com 的运行时请求；
    // 国内网络下 gstatic 不可达会导致白屏/中文豆腐块）。
    // - canvaskit/ 本地副本由 flutter build web 生成；
    // - fonts.gstatic.com/s/ 本地镜像（Noto Sans SC/TC、Color Emoji、Roboto、Symbols，
    //   SIL OFL 许可，允许随包分发）配合 flutter build web --no-web-resources-cdn 使用。
    window.flutterConfiguration = {
      canvasKitBaseUrl: 'canvaskit/',
      fontFallbackBaseUrl: 'fonts.gstatic.com/s/'
    };
  </script>
  
<script>
/* font-preload-guard：字体分片预热后再启动 Flutter（tool/patch_web_font_preload.py 注入）。
   首帧 unicode-range 分片并发请求偶发失败 → 豆腐块；全部预热（重试 ×5）
   + 服务端 immutable 缓存根治。清单缺失/预热失败均降级为直接启动，不阻塞。 */
(function () {
  function start() {
    if (window.__flutterBooted) return;
    window.__flutterBooted = true;
    var s = document.createElement('script');
    s.src = 'flutter_bootstrap.js';
    s.async = true;
    document.body.appendChild(s);
  }
  function fetchRetry(url, n) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    }).catch(function (e) {
      if (n <= 0) throw e;
      return new Promise(function (res) { setTimeout(res, 250 * (6 - n)); })
        .then(function () { return fetchRetry(url, n - 1); });
    });
  }
  fetch('fonts.gstatic.com/manifest.json')
    .then(function (r) { if (!r.ok) throw new Error('manifest ' + r.status); return r.json(); })
    .then(function (list) {
      if (!list || !list.length) { start(); return; }
      Promise.all(list.map(function (p) {
        return fetchRetry(p, 5).catch(function () { return null; });
      })).then(start);
    })
    .catch(function () { start(); });
  // 兜底：预热异常卡死 15s 后强制启动
  setTimeout(start, 15000);
})();
</script>

</body>
</html>
